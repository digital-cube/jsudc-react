name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm ci` also runs `prepare`, which builds dist.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The published .d.ts as a host sees them, under moduleResolution NodeNext and Bundler.
      - run: npm run check:types
      # The tarball holds dist (JS, .d.ts, styles.css, tokens.css), README and LICENSE only.
      - run: npm pack --dry-run
